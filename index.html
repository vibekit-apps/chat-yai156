function home(){let has=data.items.length;return `<header class="top"><div class="brand">CINEMA<i>.</i></div><button class="round" onclick="go('more')">${I.more}</button></header>${has?`<div class="eyebrow">Your personal cinema</div><h1 class="view-title">Good evening.</h1><section class="section-head"><h2>Continue watching</h2><button onclick="go('library')">See library</button></section>${cards(data.items.filter(x=>x.progress).slice(0,4))}<section class="section-head"><h2>Recent thoughts</h2><button onclick="go('thoughts')">All thoughts</button></section>${entries(data.items.flatMap(x=>(x.entries||[]).filter(e=>e.kind==='Thought').map(e=>({...e,title:x.title}))).slice(-3).reverse())}`:`<section class="home-hero"><div class="clapper">▰</div><h1>Your movie story starts here.</h1><p>Add your first movie, series, anime or drama and start collecting your thoughts, theories and favorite moments.</p><button class="primary" onclick="go('add')">＋ Add your first title</button></section><div class="features"><div class="feature">${I.thought}<span>Thoughts</span></div><div class="feature">✦<span>Theories</span></div><div class="feature">${I.heart}<span>Moments</span></div><div class="feature">${I.eye}<span>Details</span></div></div><p class="empty-note">A quiet place for every thought that happens between the opening credits and the final scene.</p>`}${nav()}`}
function library(){let filtered=data.items.filter(x=>libraryFilter==='All'||x.status===libraryFilter);return `<header class="top"><div class="brand">CINEMA<i>.</i></div><button class="round" onclick="go('add')">${I.plus}</button></header><h1 class="view-title">Моя библиотека</h1><div class="chips">${[['All','Все'],['Watching','Смотрю'],['Completed','Просмотрено'],['Want to watch','Хочу посмотреть']].map(([v,n])=>`<button class="chip ${libraryFilter===v?'active':''}" onclick="setLibraryFilter('${v}')">${n}</button>`).join('')}</div>${filtered.length?cards(filtered):'<p class="empty-note">В этой коллекции пока пусто.</p>'}${nav()}`}function setLibraryFilter(v){libraryFilter=v;render()}
function cards(a){return a.length?`<div class="content-grid">${a.map(x=>`<button class="content-card" onclick="openItem('${x.id}')"><div class="poster">${x.poster?`<img src="${esc(x.poster)}" alt="">`:'▰'}</div><div class="content-info"><b>${esc(x.title)}</b><small>${x.year||x.type} · ${x.status||'Watching'}</small></div></button>`).join('')}</div>`:'<p class="empty-note">No titles here yet.</p>'}
function add(){return `<header class="top"><button class="back" onclick="go('home')">‹</button><div class="brand">CINEMA<i>.</i></div><span></span></header><section class="sheet-panel" style="border-radius:27px"><div class="sheet-title">Что хотите посмотреть?</div><p class="sub">Введите только название — CINEMA найдёт остальное.</p><div class="type-list">${[['Movie','🎬','Фильм'],['TV Show','📺','Сериал'],['Anime','✦','Аниме'],['K-Drama','◌','Дорама']].map(x=>`<button class="type" onclick="searchScreen('${x[0]}')"><div class="type-icon">${x[1]}</div><b>${x[2]}</b></button>`).join('')}</div><button class="secondary" onclick="manualItem()">Добавить вручную</button></section>${nav()}`}
function searchScreen(type){document.body.insertAdjacentHTML('beforeend',`<div class="sheet" id="overlay"><section class="sheet-panel"><div class="grab"></div><h2 class="sheet-title">Что хотите посмотреть?</h2><p class="sub">${({Movie:'Фильм', 'TV Show':'Сериал',Anime:'Аниме','K-Drama':'Дорама'})[type]} · поиск в открытых базах</p><form class="form" onsubmit="searchTitle(event,'${type}')"><input name="q" required autofocus placeholder="Введите название"><button class="primary full">Найти</button><button type="button" class="secondary" onclick="manualItem('${type}')">Добавить вручную</button></form><div id="results"></div></section></div>`)}
async function searchTitle(e,type){e.preventDefault();let box=document.querySelector('#results'),q=new FormData(e.target).get('q').trim();box.innerHTML='<p class="empty-note">Ищем подходящие варианты…</p>';try{let list=[];if(type==='Anime'){let r=await fetch('https://api.jikan.moe/v4/anime?q='+encodeURIComponent(q)+'&limit=8&sfw=true').then(r=>r.json());list=(r.data||[]).map(x=>({source:'jikan',sourceId:x.mal_id,title:x.title,original:x.title_japanese,poster:x.images?.jpg?.large_image_url,backdrop:'',year:x.year||x.aired?.from?.slice(0,4),genres:(x.genres||[]).map(g=>g.name).join(', '),description:x.synopsis,duration:x.duration,country:'Japan',episodes:x.episodes,type}));}else if(type==='Movie'){let r=await fetch('https://itunes.apple.com/search?term='+encodeURIComponent(q)+'&entity=movie&limit=10&country=ru&lang=ru_ru').then(r=>r.json());list=(r.results||[]).map(x=>({source:'itunes',sourceId:x.trackId,title:x.trackName,original:x.trackName,poster:x.artworkUrl100?.replace('100x100','600x900'),year:x.releaseDate?.slice(0,4),genres:x.primaryGenreName,description:x.longDescription||x.shortDescription,duration:x.trackTimeMillis?Math.round(x.trackTimeMillis/60000)+' мин':'',country:x.country,actors:x.artistName,type}));if(!list.length){let w=await fetch('https://www.wikidata.org/w/api.php?action=wbsearchentities&search='+encodeURIComponent(q)+'&language=ru&format=json&origin=*&limit=8').then(r=>r.json());list=(w.search||[]).map(x=>({source:'wikidata',sourceId:x.id,title:x.match?.text||x.label,original:x.label,poster:'',year:(x.description||'').match(/(?:19|20)\d{2}/)?.[0]||'',genres:'',description:x.description||'',type}));}}else{let r=await fetch('https://api.tvmaze.com/search/shows?q='+encodeURIComponent(q)+'&lang=ru').then(r=>r.json());list=(r||[]).map(z=>{let x=z.show;return{source:'tvmaze',sourceId:x.id,title:x.name,original:x.name,poster:x.image?.original||x.image?.medium,backdrop:'',year:x.premiered?.slice(0,4),genres:(x.genres||[]).join(', '),description:(x.summary||'').replace(/<[^>]*>/g,''),duration:x.runtime?x.runtime+' мин':'',country:x.network?.country?.name||x.webChannel?.country?.name,episodes:x._links?.self?.href,type}})}if(!list.length)throw Error();window.searchCache=list;box.innerHTML=`<section class="section-head"><h2>Результаты</h2></section><div class="entry-list">${list.map((x,i)=>`<button class="type" onclick="selectResult(${i})" style="display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;min-height:76px"><div class="poster" style="height:70px;border-radius:10px">${x.poster?`<img src="${esc(x.poster)}" alt="">`:'🎬'}</div><div><b>${esc(x.title)}</b><small>${[x.year,x.genres,x.type==='Movie'?'Фильм':x.type==='TV Show'?'Сериал':x.type==='Anime'?'Аниме':'Дорама'].filter(Boolean).join(' · ')}</small></div></button>`).join('')}</div>`}catch(err){box.innerHTML='<p class="empty-note">Ничего не найдено. Попробуйте другое название или добавьте произведение вручную.</p>'}}
async function selectResult(i){let x=window.searchCache[i];if(x.source==='wikidata'){try{let e=await fetch('https://www.wikidata.org/w/api.php?action=wbgetentities&ids='+x.sourceId+'&props=claims&format=json&origin=*').then(r=>r.json()),c=e.entities[x.sourceId].claims||{},img=c.P18?.[0]?.mainsnak?.datavalue?.value;if(img)x.poster='https://commons.wikimedia.org/wiki/Special:FilePath/'+encodeURIComponent(img)+'?width=600'}catch(e){}}x.id=Date.now().toString();x.status='Watching';x.entries=[];x.distractions=0;x.progress=0;x.rating='';x.personal={};if(x.source==='tvmaze'){try{let eps=await fetch('https://api.tvmaze.com/shows/'+x.sourceId+'/episodes').then(r=>r.json());x.episodeList=eps.map(e=>({id:e.id,season:e.season,number:e.number,title:e.name,duration:e.runtime,description:(e.summary||'').replace(/<[^>]*>/g,''),entries:[],progress:0,rating:'',distractions:0}))}catch(e){x.episodeList=[]}}data.items.push(x);save();closeSheet();active=x.id;firstImpression()}
function manualItem(type='Movie'){closeSheet();document.body.insertAdjacentHTML('beforeend',`<div class="sheet" id="overlay"><section class="sheet-panel"><div class="grab"></div><h2 class="sheet-title">Добавить вручную</h2><form class="form" onsubmit="createItem(event,'${type}')"><label>Название</label><input name="title" required placeholder="Что вы смотрите?"><div class="form-row"><div><label>Год</label><input name="year" inputmode="numeric" placeholder="2026"></div><div><label>Жанры</label><input name="genres" placeholder="Драма, мистика"></div></div><label>Ссылка на постер</label><input name="poster" type="url" placeholder="https://..."><label>Описание</label><textarea name="description" placeholder="Несколько слов об этой истории..."></textarea><button class="primary full" type="submit">Добавить в CINEMA</button><button class="secondary" type="button" onclick="closeSheet()">Отмена</button></form></section></div>`)}
function createItem(e,type){e.preventDefault();let f=new FormData(e.target),x=Object.fromEntries(f);x={...x,id:Date.now().toString(),type,status:'Watching',entries:[],distractions:0,progress:0,rating:'',personal:{}};data.items.push(x);save();closeSheet();active=x.id;firstImpression()}
function closeSheet(){document.querySelector('#overlay')?.remove()}function openItem(id){active=id;go('detail')}function item(){return data.items.find(x=>x.id===active)}
function detail(){let x=item();if(!x)return go('library');let es=x.entries||[];return `<header class="top"><button class="back" onclick="go('library')">‹</button><div class="brand">CINEMA<i>.</i></div><button class="round" onclick="editStatus()">•••</button></header><div class="detail-hero"><div class="poster">${x.poster?`<img src="${esc(x.poster)}" alt="">`:'▰'}</div><div><h1>${esc(x.title)}</h1><p>${[x.year,x.genres,x.type==='Movie'?'':'Series'].filter(Boolean).join(' · ')||x.type}</p><div class="rating">★ ${x.rating?`My rating · ${x.rating}/5`:'Rate it after watching'}</div></div></div><button class="primary start" onclick="beginWatch()">${I.play} Начать просмотр</button><button class="secondary" onclick="deleteItem()">Удалить из CINEMA</button>${x.personal?.firstImpression?`<div class="entry"><small>Первое впечатление</small><p>${esc(x.personal.firstImpression)}${x.personal.expectation?' · '+esc(x.personal.expectation):''}</p></div>`:''}${x.description?`<p class="empty-note">${esc(x.description)}</p>`:''}${x.episodeList?.length?`<section class="section-head"><h2>Сезоны и эпизоды</h2></section><div class="entry-list">${x.episodeList.slice(0,40).map(e=>`<div class="entry"><small>Сезон ${e.season} · ${String(e.number).padStart(2,'0')} · ${e.duration||'—'} мин</small><p>${esc(e.title)}</p></div>`).join('')}</div>`:''}<section class="section-head"><h2>Your experience</h2></section><div class="stat-grid"><div class="stat"><b>${es.filter(e=>e.kind==='Thought').length}</b><small>Thoughts</small></div><div class="stat"><b>${es.filter(e=>e.kind==='Theory').length}</b><small>Theories</small></div><div class="stat"><b>${es.filter(e=>e.kind==='Moment').length}</b><small>Moments</small></div></div><section class="section-head"><h2>Мои заметки</h2></section>${entries(es.slice().reverse())}<section class="section-head"><h2>Как менялся интерес</h2></section>${interestGraph(es)}${strongList(es)}${x.personal?.letter?`<section class="section-head"><h2>Письмо себе</h2></section><div class="entry"><small>${x.personal.letter.date}</small><p>${esc(x.personal.letter.text)}</p></div>`:''}${nav()}`}
function strongList(es){let a=es.filter(e=>e.kind==='Сильная реакция');let f=es.filter(e=>e.kind==='Красный флаг');return (a.length||f.length)?`<section class="section-head"><h2>💔 Самые сильные моменты</h2></section>${entries([...a,...f].sort((x,y)=>x.time.localeCompare(y.time)))}`:''}
function interestGraph(es){let r=es.filter(e=>e.kind==='Реакция');return r.length?`<div class="entry" style="display:flex;align-items:end;gap:7px;height:86px">${r.map(e=>`<i title="${e.time} · ${e.tag}" style="display:block;flex:1;min-height:${e.tag==='Захватывает'?70:e.tag==='Скучно'?18:e.tag==='Мне больно'?48:58}px;background:linear-gradient(var(--pink),var(--lav));border-radius:8px 8px 2px 2px"></i>`).join('')}</div><p class="empty-note">Каждая отметка — реальная реакция во время просмотра.</p>`:'<p class="empty-note">Быстрые реакции во время просмотра появятся здесь.</p>'}
function entries(es){return es.length?`<div class="entry-list">${es.map(e=>`<div class="entry"><small>${e.time||'00:00:00'} · ${e.kind}${e.tag?' · '+e.tag:''}${e.title?' · '+esc(e.title):''}</small><p>${esc(e.text||'Saved a moment.')}</p></div>`).join('')}</div>`:'<p class="empty-note">The little things you save while watching will live here.</p>'}
function beginWatch(){let x=item();if(!x.personal?.company){companySheet();return}watching={id:active,start:Date.now(),elapsed:x.progress||0};x.personal.startedAt=new Date().toISOString();save();go('watch')}function companySheet(){document.body.insertAdjacentHTML('beforeend',`<div class="sheet" id="overlay"><section class="sheet-panel"><div class="grab"></div><h2 class="sheet-title">Кто был с тобой?</h2><div class="chips" style="flex-wrap:wrap">${['👤 Одна','❤️ С партнёром','👯 С друзьями','👨‍👩‍👧 С семьёй','🐈 С питомцем','✏️ Другое'].map(v=>`<button class="chip" onclick="saveCompany('${v}')">${v}</button>`).join('')}</div><button class="secondary" onclick="saveCompany('Не отмечено')">Пропустить</button></section></div>`)}function saveCompany(v){let x=item();x.personal=x.personal||{};x.personal.company=v;closeSheet();beginWatch()}function fmt(s){s=Math.floor(s);return [s/3600|0,(s%3600)/60|0,s%60].map(n=>String(n).padStart(2,'0')).join(':')}
function watch(){let x=item();return `<section class="watch"><header class="top"><button class="back" onclick="leaveWatch()">‹</button><div class="eyebrow">Watching now</div><span></span></header><div class="watch-title"><h1>${esc(x.title)}</h1><p>${x.type==='Movie'?'Movie':x.episodes||x.type}</p></div><div class="timer" id="timer">${fmt(watching.elapsed)}</div><div class="progress"><i id="bar"></i></div><p class="watch-note">Your time, your story. No pressure.</p><div class="watch-actions"><button class="action" onclick="entrySheet('Thought')">${I.thought}<b>Thought</b></button><button class="action" onclick="entrySheet('Theory')">✦<b>Theory</b></button><button class="action" onclick="momentSheet()">${I.heart}<b>Moment</b></button><button class="action" onclick="entrySheet('Observation')">${I.eye}<b>Noticed</b></button><button class="action" onclick="quickReaction('Захватывает')">🔥<b>Захватывает</b></button><button class="action" onclick="quickReaction('Скучно')">🥱<b>Скучно</b></button><button class="action" onclick="quickReaction('Что происходит')">🤯<b>Что происходит</b></button><button class="action" onclick="quickReaction('Мне больно')">😭<b>Мне больно</b></button><button class="action" onclick="strongMoment()">💔<b>Меня вынесло</b></button><button class="action" onclick="redFlag()">🚩<b>Красный флаг</b></button><button class="action" onclick="activity()">🧃<b>Чем занята</b></button><button class="action distraction" onclick="distract()">${I.phone}<b>I got distracted</b></button></div><button class="finish" onclick="finishWatch()">Finish watching</button></section>`}
function startTimer(){timerInt=setInterval(()=>{let n=watching.elapsed+(Date.now()-watching.start)/1000,el=document.querySelector('#timer'),bar=document.querySelector('#bar');if(el)el.textContent=fmt(n);if(bar)bar.style.width=Math.min(n/7200*100,96)+'%'},1000)}function time(){return fmt(watching.elapsed+(Date.now()-watching.start)/1000)}
function entrySheet(kind){document.body.insertAdjacentHTML('beforeend',`<div class="sheet" id="overlay"><section class="sheet-panel"><div class="grab"></div><h2 class="sheet-title">${kind==='Thought'?'What’s on your mind?':kind==='Theory'?'What’s your theory?':'What did you notice?'}</h2><p class="sub">Saved at ${time()}</p><form class="form" onsubmit="saveEntry(event,'${kind}')"><textarea name="text" required autofocus placeholder="Write a little note..."></textarea><button class="primary full">Save ${kind.toLowerCase()}</button><button class="secondary" type="button" onclick="closeSheet()">Back to watching</button></form></section></div>`) }function saveEntry(e,kind){e.preventDefault();let x=item();x.entries.push({kind,text:new FormData(e.target).get('text'),time:time(),created:Date.now()});save();closeSheet()}
function momentSheet(){let tags=['Beautiful','Emotional','Funny','Scary','Shocking','Strange'];document.body.insertAdjacentHTML('beforeend',`<div class="sheet" id="overlay"><section class="sheet-panel"><div class="grab"></div><h2 class="sheet-title">Save this moment</h2><p class="sub">A small memory at ${time()}</p><div class="chips" style="flex-wrap:wrap">${tags.map(t=>`<button class="chip" onclick="chooseMoment('${t}')">${t}</button>`).join('')}</div><button class="secondary" onclick="closeSheet()">Cancel</button></section></div>`)}function chooseMoment(tag){let x=item();x.entries.push({kind:'Moment',tag,time:time(),text:''});save();closeSheet()}function distract(){let x=item();x.distractions=(x.distractions||0)+1;x.entries.push({kind:'Distraction',time:time(),text:'A small pause.'});save();let b=document.querySelector('.distraction b');if(b){b.textContent='Noted — welcome back';setTimeout(()=>b.textContent='I got distracted',1200)}}
function strongMoment(){let options=['😭 Плачу','😱 Шок','🤯 Я в ахуе','😂 Умираю со смеху','🥹 Милота','😡 Меня бесит'];pickSheet('Меня вынесло',options,'Сильная реакция')}function redFlag(){document.body.insertAdjacentHTML('beforeend',`<div class="sheet" id="overlay"><section class="sheet-panel"><div class="grab"></div><h2 class="sheet-title">Красный флаг</h2><form class="form" onsubmit="saveFlag(event)"><input name="person" required placeholder="Кого вы не доверяете?"><textarea name="reason" placeholder="Почему? (необязательно)"></textarea><button class="primary full">Сохранить</button><button class="secondary" type="button" onclick="closeSheet()">Отмена</button></form></section></div>`)}function saveFlag(e){e.preventDefault();let f=new FormData(e.target),x=item();x.entries.push({kind:'Красный флаг',tag:f.get('person'),text:f.get('reason'),time:time()});save();closeSheet()}function activity(){pickSheet('Чем вы заняты?', ['☕ Пила чай','🍕 Ела','📱 Сидела в телефоне','💅 Делала руками','🧹 Делала по дому','🛏️ Лежала','💬 Переписывалась','🐈 С котом','✏️ Другое'],'Активность')}function pickSheet(title,options,kind){document.body.insertAdjacentHTML('beforeend',`<div class="sheet" id="overlay"><section class="sheet-panel"><div class="grab"></div><h2 class="sheet-title">${title}</h2><div class="chips" style="flex-wrap:wrap">${options.map(v=>`<button class="chip" onclick="saveQuick('${kind}','${v}')">${v}</button>`).join('')}</div><button class="secondary" onclick="closeSheet()">Отмена</button></section></div>`)}function saveQuick(kind,tag){let x=item();x.entries.push({kind,tag,time:time(),text:''});save();closeSheet()}
function quickReaction(label){let x=item();x.entries.push({kind:'Реакция',tag:label,time:time(),text:''});save();let b=event.currentTarget.querySelector('b');if(b){let old=b.textContent;b.textContent='Сохранено';setTimeout(()=>b.textContent=old,700)}}
function leaveWatch(){let x=item();x.progress=Math.floor(watching.elapsed+(Date.now()-watching.start)/1000);save();watching=null;go('detail')}function finishWatch(){let x=item();x.progress=Math.floor(watching.elapsed+(Date.now()-watching.start)/1000);x.status='Completed';x.completedAt=new Date().toISOString();save();clearInterval(timerInt);document.body.insertAdjacentHTML('beforeend',`<div class="sheet" id="overlay"><section class="sheet-panel"><div class="grab"></div><h2 class="sheet-title">Finished.</h2><p class="sub">Как тебе фильм прямо сейчас?</p><p class="empty-note">${x.personal?.firstImpression?`Ты ожидала: ${esc(x.personal.expectation||x.personal.firstImpression)}`:''}</p><div class="stat-grid"><div class="stat"><b>${x.entries.filter(e=>e.kind==='Thought').length}</b><small>Thoughts</small></div><div class="stat"><b>${x.entries.filter(e=>e.kind==='Moment').length}</b><small>Moments</small></div><div class="stat"><b>${x.distractions||0}</b><small>Pauses</small></div></div><form class="form" onsubmit="endReflection(event)"><label>My rating</label><select name="rating"><option value="">Not now</option>${[1,2,3,4,5].map(n=>`<option>${n}</option>`).join('')}</select><label>Письмо себе из сегодняшнего вечера</label><textarea name="letter" placeholder="Пара слов себе…"></textarea><label>Итоговое настроение</label><select name="aftertaste"><option value="">Не сейчас</option><option>❤️ Да, всё ещё думаю</option><option>😭 К сожалению, да</option><option>😐 Уже нет</option><option>🤯 Всё ещё не поняла</option></select><label>Последняя мысль</label><textarea name="text" placeholder="How did it leave you feeling?"></textarea><button class="primary full">Сохранить в архив</button><button type="button" class="secondary" onclick="completeNow()">Завершить без заметки</button></form></section></div>`)}function completeNow(){let x=item();x.status='Completed';x.completedAt=x.completedAt||new Date().toISOString();save();closeSheet();watching=null;go('detail')}function endReflection(e){e.preventDefault();let f=new FormData(e.target),x=item();x.rating=f.get('rating')||x.rating;if(f.get('text'))x.entries.push({kind:'After watching',text:f.get('text'),time:time()});x.personal=x.personal||{};x.personal.aftertaste=f.get('aftertaste')||'';if(f.get('letter'))x.personal.letter={text:f.get('letter'),date:new Date().toLocaleDateString('ru-RU')};save();closeSheet();watching=null;go('detail')}
function moments(){let a=data.items.flatMap(x=>(x.entries||[]).filter(e=>e.kind==='Moment').map(e=>({...e,title:x.title})));return `<header class="top"><div class="brand">CINEMA<i>.</i></div><button class="round" onclick="go('add')">${I.plus}</button></header><h1 class="view-title">My Moments</h1><div class="chips"><button class="chip active">All</button>${['Beautiful','Emotional','Funny','Scary','Shocking','Strange'].map(t=>`<button class="chip">${t}</button>`).join('')}</div><section class="section-head"><h2>Saved scenes</h2></section>${entries(a.reverse())}${nav()}`}
function thoughts(){let a=data.items.flatMap(x=>(x.entries||[]).filter(e=>e.kind==='Thought').map(e=>({...e,title:x.title})));return `<header class="top"><button class="back" onclick="go('more')">‹</button><div class="brand">CINEMA<i>.</i></div><span></span></header><h1 class="view-title">My Thoughts</h1>${entries(a.reverse())}${nav()}`}
function more(){return `<header class="top"><div class="brand">CINEMA<i>.</i></div><span></span></header><h1 class="view-title">Your cinema</h1><div class="entry-list"><button class="type" onclick="go('thoughts')"><b>My Thoughts</b><small>Every note, in one quiet place</small></button><button class="type" onclick="go('library')"><b>My Archive</b><small>Your personal viewing history</small></button><button class="type" onclick="spoilerSettings()"><b>🛡️ Режим без спойлеров</b><small>${data.settings.spoilers}</small></button><button class="type" onclick="promptSettings()"><b>Gentle prompts</b><small>${data.settings.prompts} · spoiler-free and local</small></button><button class="type" onclick="languageSettings()"><b>App language</b><small>${data.settings.language}</small></button><button class="type" onclick="themeSettings()"><b>Theme & design</b><small>${data.settings.theme}</small></button><button class="type" onclick="go('library')"><b>Хочу посмотреть</b><small>Моя полка будущих историй</small></button><button class="type" onclick="viewerStats()"><b>Я как зритель</b><small>Личная статистика просмотров</small></button><button class="type" onclick="memoryPanel()"><b>🌙 Воспоминания</b><small>Ваши прошлые кино-вечера</small></button><button class="type" onclick="recordsPanel()"><b>🏆 Мои рекорды</b><small>Только реальные данные</small></button><button class="type" onclick="futurePanel('Что посмотреть?','Выберите настроение — рекомендации появятся, когда библиотека станет больше.')"><b>Что посмотреть?</b><small>Выбор настроения — скоро</small></button><button class="type" onclick="futurePanel('Расследование','Базовый интерфейс для детективов и триллеров. Никаких спойлеров.')"><b>Расследование</b><small>Подозрения и доверие — скоро</small></button></div>${nav()}`}
function themeSettings(){document.body.insertAdjacentHTML('beforeend',`<div class="sheet" id="overlay"><section class="sheet-panel"><div class="grab"></div><h2 class="sheet-title">Theme & design</h2><p class="sub">Choose the look of your personal cinema.</p>${['Cinema','Light','Floral','Anime'].map(x=>`<button class="secondary" onclick="setTheme('${x}')">${data.settings.theme===x?'✓ ':''}${x}</button>`).join('')}<label style="display:block;margin:21px 0 8px;font-size:12px;font-weight:700">Своё фото на фон</label><input aria-label="Загрузить фото на фон" type="file" accept="image/*" onchange="setBackgroundImage(this.files[0])" style="width:100%;padding:12px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.06);color:var(--ink)">${data.settings.backgroundImage?'<button class="secondary" onclick="removeBackgroundImage()">Убрать своё фото</button>':''}<button class="secondary" onclick="closeSheet()">Закрыть</button></section></div>`);localize()}function setTheme(x){data.settings.theme=x;save();closeSheet();render()}function setBackgroundImage(file){if(!file)return;if(file.size>15*1024*1024){alert('Выберите фото до 15 МБ.');return}let r=new FileReader();r.onload=()=>{let img=new Image();img.onload=()=>{let max=2400,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);data.settings.backgroundImage=c.toDataURL('image/jpeg',.9);try{save();closeSheet();render()}catch(e){alert('Фото слишком большое для локального хранения. Выберите другое или уменьшите его.')}};img.src=r.result};r.readAsDataURL(file)}function removeBackgroundImage(){delete data.settings.backgroundImage;save();closeSheet();render()}
function viewerStats(){let a=data.items,es=a.flatMap(x=>x.entries||[]),n=k=>es.filter(e=>e.kind===k).length,correct=es.filter(e=>e.kind==='Theory'&&e.result==='Угадала').length,answered=es.filter(e=>e.kind==='Theory'&&e.result).length,avg=a.filter(x=>x.rating).reduce((s,x)=>s+Number(x.rating),0)/(a.filter(x=>x.rating).length||1);document.body.insertAdjacentHTML('beforeend',`<div class="sheet" id="overlay"><section class="sheet-panel"><div class="grab"></div><h2 class="sheet-title">Я как зритель</h2><div class="stat-grid"><div class="stat"><b>${a.filter(x=>x.status==='Completed').length}</b><small>Просмотрено</small></div><div class="stat"><b>${n('Thought')}</b><small>Мыслей</small></div><div class="stat"><b>${n('Theory')}</b><small>Теорий</small></div><div class="stat"><b>${n('Moment')}</b><small>Моментов</small></div><div class="stat"><b>${n('Observation')}</b><small>Наблюдений</small></div><div class="stat"><b>${a.length?((a.reduce((s,x)=>s+(x.distractions||0),0)/a.length).toFixed(1)):0}</b><small>Сред. отвлечений</small></div></div><p class="empty-note">Прогнозы: ${n('Theory')}, точность: ${answered?Math.round(correct/answered*100)+'%':'пока нет данных'}.</p><p class="empty-note">Средняя оценка: ${avg?avg.toFixed(1)+'/5':'пока нет'}. Статистика строится только по вашим данным.</p><button class="secondary" onclick="closeSheet()">Закрыть</button></section></div>`)}function futurePanel(title,text){let a=data.items.filter(x=>x.status!=='Completed');if(!a.length)a=data.items;document.body.insertAdjacentHTML('beforeend',`<div class="sheet" id="overlay"><section class="sheet-panel"><div class="grab"></div><h2 class="sheet-title">${title}</h2><p class="sub">Сколько у тебя сегодня сил?</p><div class="chips" style="flex-wrap:wrap"><button class="chip" onclick="chooseForMe()">🔋 100%</button><button class="chip" onclick="chooseForMe()">🔋 70%</button><button class="chip" onclick="chooseForMe()">🔋 40%</button><button class="chip" onclick="chooseForMe()">🔋 10%</button></div><div id="pick-result">${a.length?'<p class="empty-note">Выбор будет только из вашей библиотеки.</p>':'<p class="empty-note">Сначала добавьте фильм в библиотеку.</p>'}</div><button class="secondary" onclick="closeSheet()">Закрыть</button></section></div>`)}function chooseForMe(){let a=data.items.filter(x=>x.status!=='Completed');if(!a.length)a=data.items;if(!a.length)return;let x=a[Math.floor(Math.random()*a.length)];document.querySelector('#pick-result').innerHTML=`<button class="type" onclick="closeSheet();openItem('${x.id}')"><b>Сегодня — ${esc(x.title)}</b><small>${x.genres||x.type}</small></button>`}
function memoryPanel(){let a=data.items.filter(x=>x.status==='Completed');document.body.insertAdjacentHTML('beforeend',`<div class="sheet" id="overlay"><section class="sheet-panel"><div class="grab"></div><h2 class="sheet-title">🌙 Воспоминания</h2>${a.length?entries(a.map(x=>({kind:'Просмотрено',time:x.personal?.startedAt?new Date(x.personal.startedAt).toLocaleDateString('ru-RU'):'',text:x.title+' · '+(x.rating?x.rating+'/5':'без оценки')}))):'<p class="empty-note">Здесь появятся завершённые кино-вечера.</p>'}<button class="secondary" onclick="closeSheet()">Закрыть</button></section></div>`)}function recordsPanel(){let a=data.items,rank=(fn)=>a.slice().sort((x,y)=>fn(y)-fn(x))[0],count=(x,k)=>(x?.entries||[]).filter(e=>e.kind===k).length;let top=rank(x=>count(x,'Сильная реакция'));document.body.insertAdjacentHTML('beforeend',`<div class="sheet" id="overlay"><section class="sheet-panel"><div class="grab"></div><h2 class="sheet-title">🏆 Мои рекорды</h2><p class="empty-note">${top?'💔 Самый эмоциональный: '+esc(top.title):'Рекорды появятся после ваших просмотров.'}</p><button class="secondary" onclick="closeSheet()">Закрыть</button></section></div>`)}function spoilerSettings(){document.body.insertAdjacentHTML('beforeend',`<div class="sheet" id="overlay"><section class="sheet-panel"><div class="grab"></div><h2 class="sheet-title">🛡️ Режим без спойлеров</h2>${['🟢 Только просмотренное','🟡 Можно обсуждать предыдущие события','🔴 Я закончила — можно всё'].map(v=>`<button class="secondary" onclick="data.settings.spoilers='${v}';save();closeSheet();render()">${data.settings.spoilers===v?'✓ ':''}${v}</button>`).join('')}<button class="secondary" onclick="closeSheet()">Закрыть</button></section></div>`)}
function languageSettings(){document.body.insertAdjacentHTML('beforeend',`<div class="sheet" id="overlay"><section class="sheet-panel"><div class="grab"></div><h2 class="sheet-title">App language</h2><p class="sub">Choose the language CINEMA uses on this device.</p>${['English','Русский'].map(x=>`<button class="secondary" onclick="setLanguage('${x}')">${data.settings.language===x?'✓ ':''}${x}</button>`).join('')}</section></div>`)}function setLanguage(x){data.settings.language=x;save();closeSheet();render()}
function promptSettings(){document.body.insertAdjacentHTML('beforeend',`<div class="sheet" id="overlay"><section class="sheet-panel"><div class="grab"></div><h2 class="sheet-title">Watching prompts</h2><p class="sub">Tiny, spoiler-free nudges. They stay local to this device.</p>${['Gentle','Normal','Engage me','I’m bored'].map(x=>`<button class="secondary" onclick="setPrompt('${x}')">${data.settings.prompts===x?'✓ ':''}${x}</button>`).join('')}</section></div>`)}function setPrompt(x){data.settings.prompts=x;save();closeSheet();go('more')}function editStatus(){let x=item();x.status=x.status==='Want to watch'?'Watching':'Want to watch';save();render()}function deleteItem(){let x=item();if(!x||!confirm('Удалить «'+x.title+'» из библиотеки? Личные записи для него тоже будут удалены.'))return;data.items=data.items.filter(i=>i.id!==x.id);save();active=null;go('library')}function go(v){view=v;render()}render();new MutationObserver(()=>localize()).observe(document.body,{childList:true,subtree:true});if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');
</script></body></html>
