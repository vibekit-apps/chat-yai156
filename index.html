<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171222"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="/manifest.webmanifest"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet"><title>CINEMA — Your movie story</title>
<style>
:root{--bg:#110e19;--surface:#1b1627;--surface2:#241d32;--line:rgba(255,255,255,.09);--ink:#f8f3fb;--muted:#aaa0b4;--pink:#e2a9bd;--lav:#c4b5fd;--blue:#9bc8e8;--warm:#e7bc8f;--good:#b8d6ac}*{box-sizing:border-box}body{margin:0;background:radial-gradient(700px 400px at 10% -10%,#342650 0%,transparent 67%),radial-gradient(600px 500px at 100% 20%,#312440 0%,transparent 70%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:'DM Sans',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}button,input,textarea,select{font:inherit}button{color:inherit;cursor:pointer}#app{max-width:680px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 18px calc(100px + env(safe-area-inset-bottom));overflow:hidden}.top{display:flex;justify-content:space-between;align-items:center;padding:21px 2px 16px}.brand{font:700 25px 'Playfair Display';letter-spacing:.04em}.brand i{color:var(--pink)}.round{border:1px solid var(--line);background:rgba(255,255,255,.06);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:20px}.round svg,.nav svg,.feature svg,.type-icon svg,.action svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.eyebrow{color:var(--pink);font-size:12px;letter-spacing:.13em;text-transform:uppercase;font-weight:700}.home-hero{position:relative;margin-top:36px;padding:31px 25px 28px;border:1px solid rgba(235,215,246,.13);border-radius:28px;background:linear-gradient(135deg,rgba(224,169,190,.15),rgba(178,154,232,.10) 55%,rgba(148,198,232,.12));box-shadow:0 20px 65px rgba(0,0,0,.22);overflow:hidden}.home-hero:after{content:'';position:absolute;width:190px;height:190px;border:1px solid rgba(255,255,255,.12);border-radius:50%;right:-65px;top:-75px}.clapper{font-size:37px;position:relative;z-index:1}.home-hero h1{font:600 31px/1.12 'Playfair Display';margin:15px 0 10px;max-width:290px}.home-hero p{color:#d1c6d4;font-size:14px;line-height:1.55;max-width:305px;margin:0 0 22px}.primary{border:0;border-radius:15px;padding:14px 19px;min-height:48px;background:linear-gradient(110deg,#e8b9c8,#c5b5ef);color:#251d2d;font-weight:700;box-shadow:0 8px 21px rgba(207,166,210,.18)}.features{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:22px 0}.feature{min-height:96px;padding:13px 10px;border-radius:19px;border:1px solid var(--line);background:rgba(255,255,255,.045);display:flex;flex-direction:column;justify-content:space-between}.feature:nth-child(1){color:#edb8c8}.feature:nth-child(2){color:#d1b9f4}.feature:nth-child(3){color:#efaaa9}.feature:nth-child(4){color:#acd2e8}.feature span{font-size:11px;color:var(--ink);font-weight:600}.section-head{display:flex;align-items:baseline;justify-content:space-between;margin:30px 2px 13px}.section-head h2{font:600 21px 'Playfair Display';margin:0}.section-head button{color:var(--pink);background:none;border:0;font-size:13px}.empty-note{color:var(--muted);font-size:14px;line-height:1.5;padding:10px 2px}.nav{position:fixed;z-index:10;bottom:0;left:50%;transform:translateX(-50%);width:min(680px,100%);padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#15111e 20%);display:flex;justify-content:space-around}.nav button{width:58px;height:58px;border:none;background:none;color:#948b9f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px}.nav button.active{color:var(--ink)}.nav .add{width:49px;height:49px;border-radius:17px;background:linear-gradient(145deg,#eab7c8,#bbabe8);color:#201a27;margin-top:-12px;box-shadow:0 9px 24px rgba(194,162,212,.26)}.view-title{font:600 31px 'Playfair Display';margin:14px 0 21px}.chips{display:flex;gap:8px;overflow:auto;padding-bottom:4px;scrollbar-width:none}.chip{white-space:nowrap;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:99px;padding:9px 13px;color:var(--muted);font-size:12px}.chip.active{background:rgba(225,169,190,.16);border-color:rgba(225,169,190,.32);color:#f6d9e3}.category-grid,.content-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:20px}.category,.content-card{border:1px solid var(--line);background:rgba(255,255,255,.045);border-radius:22px;padding:18px;min-height:124px;text-align:left}.category svg{width:23px;height:23px;color:var(--lav);margin-bottom:18px}.category b{display:block;font-size:14px}.category small{color:var(--muted);font-size:12px}.content-card{padding:0;overflow:hidden;min-height:0}.poster{aspect-ratio:2/3;background:linear-gradient(145deg,#403050,#222b42);display:grid;place-items:center;font-size:30px;color:#ded0e9;position:relative;overflow:hidden}.poster img{width:100%;height:100%;object-fit:cover;display:block}.content-info{padding:12px}.content-info b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.content-info small{color:var(--muted);font-size:12px}.sheet,.modal{position:fixed;inset:0;z-index:20;background:rgba(8,6,13,.57);backdrop-filter:blur(7px);display:flex;align-items:flex-end}.sheet-panel{width:min(680px,100%);margin:auto;background:linear-gradient(145deg,#282035,#191422);border:1px solid rgba(255,255,255,.11);border-radius:28px 28px 0 0;padding:13px 19px calc(23px + env(safe-area-inset-bottom));box-shadow:0 -20px 60px rgba(0,0,0,.35);max-height:92vh;overflow:auto}.grab{width:38px;height:4px;background:#756b80;border-radius:5px;margin:0 auto 22px}.sheet-title{font:600 25px 'Playfair Display';margin:0 0 7px}.sub{margin:0 0 21px;color:var(--muted);font-size:14px}.type-list{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.type{border:1px solid var(--line);background:rgba(255,255,255,.045);border-radius:18px;padding:15px;text-align:left;min-height:103px}.type-icon{color:var(--pink);height:34px}.type b{display:block;font-size:14px;margin-top:9px}.form label{display:block;color:#cfc5d4;font-size:12px;font-weight:700;margin:16px 0 7px}.form input,.form textarea,.form select{width:100%;border:1px solid var(--line);border-radius:13px;padding:13px;background:rgba(255,255,255,.06);color:var(--ink);outline:0}.form textarea{resize:vertical;min-height:86px}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.secondary{width:100%;border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:14px;padding:13px;margin-top:11px;color:#ded2e4}.full{width:100%;margin-top:22px}.watch{padding-top:6px;min-height:100vh;display:flex;flex-direction:column}.watch .top{padding-top:15px}.watch-title{text-align:center;margin:35px auto 0}.watch-title h1{font:600 28px 'Playfair Display';margin:0}.watch-title p{color:var(--muted);margin:7px 0}.timer{font:600 55px/1 'Playfair Display';letter-spacing:-.05em;text-align:center;margin:43px 0 13px}.progress{height:5px;border-radius:9px;background:rgba(255,255,255,.09);overflow:hidden}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--lav));border-radius:inherit}.watch-note{text-align:center;color:var(--muted);font-size:12px;margin:12px}.watch-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-top:auto;padding-top:25px}.action{border:1px solid var(--line);border-radius:19px;padding:15px;background:rgba(255,255,255,.055);text-align:left;min-height:76px}.action svg{display:block;color:var(--pink);margin-bottom:7px}.action b{font-size:13px}.action.distraction{grid-column:span 2;display:flex;align-items:center;gap:10px;min-height:53px;padding:12px 16px}.action.distraction svg{margin:0;color:var(--blue)}.finish{background:none;border:0;color:var(--muted);margin:18px auto 0;font-size:13px}.entry-list{display:grid;gap:10px}.entry{border-left:2px solid var(--pink);padding:11px 13px;background:rgba(255,255,255,.04);border-radius:0 13px 13px 0}.entry p{margin:0;font-size:14px}.entry small{color:var(--muted);font-size:11px}.back{border:0;background:none;color:var(--ink);font-size:24px;padding:4px}.detail-hero{display:grid;grid-template-columns:122px 1fr;gap:18px;align-items:end;margin:11px 0 26px}.detail-hero .poster{border-radius:17px}.detail-hero h1{font:600 27px/1.08 'Playfair Display';margin:0 0 9px}.detail-hero p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}.rating{margin-top:15px;font-size:13px;color:var(--warm)}.start{width:100%;margin-bottom:8px}.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:15px;padding:12px;text-align:center}.stat b{font-size:19px;display:block;color:#e8d9ec}.stat small{font-size:10px;color:var(--muted)}.hidden{display:none!important}@media(min-width:700px){#app{padding-left:32px;padding-right:32px}.features{gap:14px}.feature{min-height:110px}.watch-actions{grid-template-columns:repeat(3,1fr)}.action.distraction{grid-column:span 3}.nav{border:1px solid var(--line);border-bottom:0;border-radius:23px 23px 0 0;background:#181321}}
</style></head><body><main id="app"></main><script>
const I={home:'<svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 21v-7h6v7"/></svg>',film:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v18M17 3v18M3 8h4M17 8h4M3 16h4M17 16h4"/></svg>',plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',heart:'<svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.9-8.6a5.5 5.5 0 0 0-.1-7.8z"/></svg>',more:'<svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>',thought:'<svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.5 9 9 0 0 1-4.6-1.3L3 20l1.4-4.1A8.4 8.4 0 0 1 3 11.5 8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"/></svg>',eye:'<svg viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.5"/></svg>',play:'<svg viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z"/></svg>',phone:'<svg viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M10 18h4"/></svg>'};
let data=JSON.parse(localStorage.getItem('cinema-data')||'{"items":[],"settings":{"prompts":"Normal"}}'),view='home',active=null,watching=null,timerInt;
const save=()=>localStorage.setItem('cinema-data',JSON.stringify(data)); const esc=s=>String(s||'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function nav(){return `<nav class="nav">${[['home','Home',I.home],['library','Library',I.film],['add','Add',I.plus],['moments','Moments',I.heart],['more','More',I.more]].map(([v,n,i])=>`<button class="${view===v?'active ':''}${v==='add'?'add':''}" onclick="go('${v}')">${i}<span>${n}</span></button>`).join('')}</nav>`}
function render(){clearInterval(timerInt);let h=view==='home'?home():view==='library'?library():view==='add'?add():view==='moments'?moments():view==='more'?more():view==='detail'?detail():view==='watch'?watch():thoughts();document.querySelector('#app').innerHTML=h;if(view==='watch')startTimer()}
function home(){let has=data.items.length;return `<header class="top"><div class="brand">CINEMA<i>.</i></div><button class="round" onclick="go('more')">${I.more}</button></header>${has?`<div class="eyebrow">Your personal cinema</div><h1 class="view-title">Good evening.</h1><section class="section-head"><h2>Continue watching</h2><button onclick="go('library')">See library</button></section>${cards(data.items.filter(x=>x.progress).slice(0,4))}<section class="section-head"><h2>Recent thoughts</h2><button onclick="go('thoughts')">All thoughts</button></section>${entries(data.items.flatMap(x=>(x.entries||[]).filter(e=>e.kind==='Thought').map(e=>({...e,title:x.title}))).slice(-3).reverse())}`:`<section class="home-hero"><div class="clapper">▰</div><h1>Your movie story starts here.</h1><p>Add your first movie, series, anime or drama and start collecting your thoughts, theories and favorite moments.</p><button class="primary" onclick="go('add')">＋ Add your first title</button></section><div class="features"><div class="feature">${I.thought}<span>Thoughts</span></div><div class="feature">✦<span>Theories</span></div><div class="feature">${I.heart}<span>Moments</span></div><div class="feature">${I.eye}<span>Details</span></div></div><p class="empty-note">A quiet place for every thought that happens between the opening credits and the final scene.</p>`}${nav()}`}
function library(){let types=['Movie','TV Show','Anime','K-Drama'];return `<header class="top"><div class="brand">CINEMA<i>.</i></div><button class="round" onclick="go('add')">${I.plus}</button></header><h1 class="view-title">My Library</h1><div class="chips"><button class="chip active">All</button><button class="chip">Watching</button><button class="chip">Completed</button><button class="chip">Want to watch</button></div>${data.items.length?cards(data.items):`<div class="category-grid">${types.map((x,i)=>`<button class="category" onclick="newItem('${x}')">${[I.film,I.film,'✦','◌'][i]}<b>${x}${x==='Movie'?'s':''}</b><small>Nothing here yet</small></button>`).join('')}</div><p class="empty-note" style="margin-top:20px">Your library only holds the stories you choose to bring into it.</p>`}${nav()}`}
function cards(a){return a.length?`<div class="content-grid">${a.map(x=>`<button class="content-card" onclick="openItem('${x.id}')"><div class="poster">${x.poster?`<img src="${esc(x.poster)}" alt="">`:'▰'}</div><div class="content-info"><b>${esc(x.title)}</b><small>${x.year||x.type} · ${x.status||'Watching'}</small></div></button>`).join('')}</div>`:'<p class="empty-note">No titles here yet.</p>'}
function add(){return `<header class="top"><button class="back" onclick="go('home')">‹</button><div class="brand">CINEMA<i>.</i></div><span></span></header><section class="sheet-panel" style="border-radius:27px"><div class="sheet-title">What are you watching?</div><p class="sub">Start with a title. You can make it yours from there.</p><div class="type-list">${['Movie','TV Show','Anime','K-Drama'].map((x,i)=>`<button class="type" onclick="newItem('${x}')"><div class="type-icon">${[I.film,I.film,'✦','◌'][i]}</div><b>${x}</b></button>`).join('')}</div></section>${nav()}`}
function newItem(type){document.body.insertAdjacentHTML('beforeend',`<div class="sheet" id="overlay"><section class="sheet-panel"><div class="grab"></div><h2 class="sheet-title">Add ${type}</h2><form class="form" onsubmit="createItem(event,'${type}')"><label>Title</label><input name="title" required placeholder="What are you watching?"><div class="form-row"><div><label>Year</label><input name="year" inputmode="numeric" placeholder="2026"></div><div><label>Genres</label><input name="genres" placeholder="Drama, Mystery"></div></div><label>Poster image URL <span style="font-weight:400;color:var(--muted)">(optional)</span></label><input name="poster" type="url" placeholder="https://..."><label>Description <span style="font-weight:400;color:var(--muted)">(optional)</span></label><textarea name="description" placeholder="A few words about this story..."></textarea>${type!=='Movie'?'<label>Seasons / episodes <span style="font-weight:400;color:var(--muted)">(optional)</span></label><input name="episodes" placeholder="e.g. Season 1 · Episode 1">':''}<button class="primary full" type="submit">Add to my cinema</button><button class="secondary" type="button" onclick="closeSheet()">Cancel</button></form></section></div>`) }
function createItem(e,type){e.preventDefault();let f=new FormData(e.target),x=Object.fromEntries(f);x={...x,id:Date.now().toString(),type,status:'Watching',entries:[],distractions:0,progress:0,rating:''};data.items.push(x);save();closeSheet();active=x.id;go('detail')}
function closeSheet(){document.querySelector('#overlay')?.remove()}function openItem(id){active=id;go('detail')}function item(){return data.items.find(x=>x.id===active)}
function detail(){let x=item();if(!x)return go('library');let es=x.entries||[];return `<header class="top"><button class="back" onclick="go('library')">‹</button><div class="brand">CINEMA<i>.</i></div><button class="round" onclick="editStatus()">•••</button></header><div class="detail-hero"><div class="poster">${x.poster?`<img src="${esc(x.poster)}" alt="">`:'▰'}</div><div><h1>${esc(x.title)}</h1><p>${[x.year,x.genres,x.type==='Movie'?'':'Series'].filter(Boolean).join(' · ')||x.type}</p><div class="rating">★ ${x.rating?`My rating · ${x.rating}/5`:'Rate it after watching'}</div></div></div><button class="primary start" onclick="beginWatch()">${I.play} Start watching</button><section class="section-head"><h2>Your experience</h2></section><div class="stat-grid"><div class="stat"><b>${es.filter(e=>e.kind==='Thought').length}</b><small>Thoughts</small></div><div class="stat"><b>${es.filter(e=>e.kind==='Theory').length}</b><small>Theories</small></div><div class="stat"><b>${es.filter(e=>e.kind==='Moment').length}</b><small>Moments</small></div></div><section class="section-head"><h2>My notes</h2></section>${entries(es.slice().reverse())}${nav()}`}
function entries(es){return es.length?`<div class="entry-list">${es.map(e=>`<div class="entry"><small>${e.time||'00:00:00'} · ${e.kind}${e.tag?' · '+e.tag:''}${e.title?' · '+esc(e.title):''}</small><p>${esc(e.text||'Saved a moment.')}</p></div>`).join('')}</div>`:'<p class="empty-note">The little things you save while watching will live here.</p>'}
function beginWatch(){watching={id:active,start:Date.now(),elapsed:item().progress||0};go('watch')}function fmt(s){s=Math.floor(s);return [s/3600|0,(s%3600)/60|0,s%60].map(n=>String(n).padStart(2,'0')).join(':')}
function watch(){let x=item();return `<section class="watch"><header class="top"><button class="back" onclick="leaveWatch()">‹</button><div class="eyebrow">Watching now</div><span></span></header><div class="watch-title"><h1>${esc(x.title)}</h1><p>${x.type==='Movie'?'Movie':x.episodes||x.type}</p></div><div class="timer" id="timer">${fmt(watching.elapsed)}</div><div class="progress"><i id="bar"></i></div><p class="watch-note">Your time, your story. No pressure.</p><div class="watch-actions"><button class="action" onclick="entrySheet('Thought')">${I.thought}<b>Thought</b></button><button class="action" onclick="entrySheet('Theory')">✦<b>Theory</b></button><button class="action" onclick="momentSheet()">${I.heart}<b>Moment</b></button><button class="action" onclick="entrySheet('Observation')">${I.eye}<b>Noticed</b></button><button class="action distraction" onclick="distract()">${I.phone}<b>I got distracted</b></button></div><button class="finish" onclick="finishWatch()">Finish watching</button></section>`}
function startTimer(){timerInt=setInterval(()=>{let n=watching.elapsed+(Date.now()-watching.start)/1000,el=document.querySelector('#timer'),bar=document.querySelector('#bar');if(el)el.textContent=fmt(n);if(bar)bar.style.width=Math.min(n/7200*100,96)+'%'},1000)}function time(){return fmt(watching.elapsed+(Date.now()-watching.start)/1000)}
function entrySheet(kind){document.body.insertAdjacentHTML('beforeend',`<div class="sheet" id="overlay"><section class="sheet-panel"><div class="grab"></div><h2 class="sheet-title">${kind==='Thought'?'What’s on your mind?':kind==='Theory'?'What’s your theory?':'What did you notice?'}</h2><p class="sub">Saved at ${time()}</p><form class="form" onsubmit="saveEntry(event,'${kind}')"><textarea name="text" required autofocus placeholder="Write a little note..."></textarea><button class="primary full">Save ${kind.toLowerCase()}</button><button class="secondary" type="button" onclick="closeSheet()">Back to watching</button></form></section></div>`) }function saveEntry(e,kind){e.preventDefault();let x=item();x.entries.push({kind,text:new FormData(e.target).get('text'),time:time(),created:Date.now()});save();closeSheet()}
function momentSheet(){let tags=['Beautiful','Emotional','Funny','Scary','Shocking','Strange'];document.body.insertAdjacentHTML('beforeend',`<div class="sheet" id="overlay"><section class="sheet-panel"><div class="grab"></div><h2 class="sheet-title">Save this moment</h2><p class="sub">A small memory at ${time()}</p><div class="chips" style="flex-wrap:wrap">${tags.map(t=>`<button class="chip" onclick="chooseMoment('${t}')">${t}</button>`).join('')}</div><button class="secondary" onclick="closeSheet()">Cancel</button></section></div>`)}function chooseMoment(tag){let x=item();x.entries.push({kind:'Moment',tag,time:time(),text:''});save();closeSheet()}function distract(){let x=item();x.distractions=(x.distractions||0)+1;x.entries.push({kind:'Distraction',time:time(),text:'A small pause.'});save();let b=document.querySelector('.distraction b');if(b){b.textContent='Noted — welcome back';setTimeout(()=>b.textContent='I got distracted',1200)}}
function leaveWatch(){let x=item();x.progress=Math.floor(watching.elapsed+(Date.now()-watching.start)/1000);save();watching=null;go('detail')}function finishWatch(){let x=item();x.progress=Math.floor(watching.elapsed+(Date.now()-watching.start)/1000);x.status='Completed';save();clearInterval(timerInt);document.body.insertAdjacentHTML('beforeend',`<div class="sheet" id="overlay"><section class="sheet-panel"><div class="grab"></div><h2 class="sheet-title">Finished.</h2><p class="sub">How do you feel right now?</p><div class="stat-grid"><div class="stat"><b>${x.entries.filter(e=>e.kind==='Thought').length}</b><small>Thoughts</small></div><div class="stat"><b>${x.entries.filter(e=>e.kind==='Moment').length}</b><small>Moments</small></div><div class="stat"><b>${x.distractions||0}</b><small>Pauses</small></div></div><form class="form" onsubmit="endReflection(event)"><label>My rating</label><select name="rating"><option value="">Not now</option>${[1,2,3,4,5].map(n=>`<option>${n}</option>`).join('')}</select><label>A final thought</label><textarea name="text" placeholder="How did it leave you feeling?"></textarea><button class="primary full">Save to archive</button></form></section></div>`)}function endReflection(e){e.preventDefault();let f=new FormData(e.target),x=item();x.rating=f.get('rating')||x.rating;if(f.get('text'))x.entries.push({kind:'After watching',text:f.get('text'),time:time()});save();closeSheet();watching=null;go('detail')}
function moments(){let a=data.items.flatMap(x=>(x.entries||[]).filter(e=>e.kind==='Moment').map(e=>({...e,title:x.title})));return `<header class="top"><div class="brand">CINEMA<i>.</i></div><button class="round" onclick="go('add')">${I.plus}</button></header><h1 class="view-title">My Moments</h1><div class="chips"><button class="chip active">All</button>${['Beautiful','Emotional','Funny','Scary','Shocking','Strange'].map(t=>`<button class="chip">${t}</button>`).join('')}</div><section class="section-head"><h2>Saved scenes</h2></section>${entries(a.reverse())}${nav()}`}
function thoughts(){let a=data.items.flatMap(x=>(x.entries||[]).filter(e=>e.kind==='Thought').map(e=>({...e,title:x.title})));return `<header class="top"><button class="back" onclick="go('more')">‹</button><div class="brand">CINEMA<i>.</i></div><span></span></header><h1 class="view-title">My Thoughts</h1>${entries(a.reverse())}${nav()}`}
function more(){return `<header class="top"><div class="brand">CINEMA<i>.</i></div><span></span></header><h1 class="view-title">Your cinema</h1><div class="entry-list"><button class="type" onclick="go('thoughts')"><b>My Thoughts</b><small>Every note, in one quiet place</small></button><button class="type" onclick="go('library')"><b>My Archive</b><small>Your personal viewing history</small></button><button class="type" onclick="promptSettings()"><b>Gentle prompts</b><small>${data.settings.prompts} · spoiler-free and local</small></button><button class="type" onclick="go('library')"><b>Want to Watch</b><small>A future shelf for your next story</small></button></div>${nav()}`}
function promptSettings(){document.body.insertAdjacentHTML('beforeend',`<div class="sheet" id="overlay"><section class="sheet-panel"><div class="grab"></div><h2 class="sheet-title">Watching prompts</h2><p class="sub">Tiny, spoiler-free nudges. They stay local to this device.</p>${['Gentle','Normal','Engage me','I’m bored'].map(x=>`<button class="secondary" onclick="setPrompt('${x}')">${data.settings.prompts===x?'✓ ':''}${x}</button>`).join('')}</section></div>`)}function setPrompt(x){data.settings.prompts=x;save();closeSheet();go('more')}function editStatus(){let x=item();x.status=x.status==='Want to watch'?'Watching':'Want to watch';save();render()}function go(v){view=v;render()}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');
</script></body></html>
